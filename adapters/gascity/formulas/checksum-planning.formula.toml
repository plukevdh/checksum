description = "Checksum design and planning; policy validation rather than a routine human gate."
formula = "checksum-planning"
version = 1
contract = "graph.v2"
extends = ["planning-base"]
target_required = false
internal = true

[vars.artifact_root]
required = true
[vars.context_path]
default = ""
[vars.requirements_path]
default = ""
[vars.plan_path]
default = ""
[vars.review_mode]
default = "report"
[vars.interaction_mode]
default = "autonomous"

[[steps]]
id = "prepare-planning"
title = "Prepare checksum planning"
metadata = { "gc.run_target" = "checksum-host.operator" }
description_file = "../assets/workflows/planning-base/prepare-planning.md"
[[steps]]
id = "requirements"
title = "Design checksum requirements"
needs = ["prepare-planning"]
metadata = { "gc.run_target" = "checksum-host.operator", "gc.build.artifact_schema" = "gc.build.requirements.v1", "gc.build.artifact_path_keys" = "gc.build.requirements_path,gc.var.requirements_path" }
description_file = "../assets/workflows/planning-base/requirements.md"
[steps.check]
max_attempts = 3
[steps.check.check]
mode = "exec"
path = ".gc/scripts/checks/build-artifact-valid.sh"
timeout = "5m"
[[steps]]
id = "plan"
title = "Plan checksum work"
needs = ["requirements"]
metadata = { "gc.run_target" = "checksum-host.operator", "gc.build.artifact_schema" = "gc.build.plan.v1", "gc.build.artifact_path_keys" = "gc.build.plan_path,gc.var.plan_path" }
description_file = "../assets/workflows/planning-base/plan.md"
[steps.check]
max_attempts = 3
[steps.check.check]
mode = "exec"
path = ".gc/scripts/checks/build-artifact-valid.sh"
timeout = "5m"
[[steps]]
id = "plan-review"
title = "Review checksum plan"
needs = ["plan"]
metadata = { "gc.run_target" = "checksum-host.reviewer" }
description_file = "../assets/workflows/planning-base/plan-review.md"
